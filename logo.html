<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé bleu-violet -->
    <linearGradient id="vsnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E45E2" />
      <stop offset="100%" stop-color="#89D3CE" />
    </linearGradient>
    
    <!-- Ombre portée pour effet 3D -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Fond transparent (peut être changé) -->
  <rect width="300" height="200" fill="transparent" />
  
  <!-- Groupe du logo avec effet d'ombre -->
  <g filter="url(#softShadow)" transform="translate(40, 60)">
    <!-- Lettre V -->
    <path d="M0 0 L25 80 L50 0" fill="none" stroke="url(#vsnGradient)" stroke-width="10" stroke-linecap="round" />
    
    <!-- Lettre S (design moderne) -->
    <path d="M70 0 Q95 -5 95 20 Q95 45 70 50 Q45 55 45 80 Q45 105 70 110" 
          fill="none" stroke="url(#vsnGradient)" stroke-width="10" stroke-linecap="round" />
    
    <!-- Lettre N (oblique dynamique) -->
    <path d="M120 0 L120 80 L170 0 L170 80" 
          fill="none" stroke="url(#vsnGradient)" stroke-width="10" stroke-linecap="round" />
  </g>
  
  <!-- Points décoratifs (optionnels) -->
  <circle cx="280" cy="30" r="5" fill="#6E45E2" opacity="0.7" />
  <circle cx="20" cy="170" r="4" fill="#89D3CE" opacity="0.7" />
</svg>
</body>
</html>
